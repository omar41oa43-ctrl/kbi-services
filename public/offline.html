<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | KBI Repair</title>
  <meta name="theme-color" content="#06b6d4">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000000;
      color: #ffffff;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .container {
      padding: 2rem;
      max-width: 400px;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
      background: linear-gradient(to right, #ffffff, #cffafe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #9ca3af;
      margin-bottom: 2rem;
      line-height: 1.5;
    }
    .icon {
      width: 64px;
      height: 64px;
      margin-bottom: 1.5rem;
      color: #06b6d4;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #06b6d4;
      color: #000000;
      padding: 0.75rem 1.5rem;
      border-radius: 9999px;
      text-decoration: none;
      font-weight: 600;
      margin-top: 1rem;
      transition: opacity 0.2s;
      border: none;
      cursor: pointer;
      width: 100%;
      box-sizing: border-box;
    }
    .btn:active {
      opacity: 0.9;
    }
    .btn-outline {
      background-color: transparent;
      border: 1px solid #334155;
      color: #ffffff;
      margin-top: 0.75rem;
    }
    .glass {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 1rem;
      padding: 2rem;
    }
  </style>
</head>
<body>
  <div class="container glass">
    <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
      <line x1="1" y1="1" x2="23" y2="23"></line>
    </svg>
    <h1>You are Offline</h1>
    <p>Check your internet connection to access the full app.</p>
    
    <button onclick="window.location.reload()" class="btn">Try Again</button>
    
    <a href="tel:+971507313446" class="btn btn-outline">Call Support</a>
  </div>
</body>
</html>
