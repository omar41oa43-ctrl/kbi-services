name: Technician app checks

on:
  push:
    paths:
      - "kbi_technician_app/**"
      - "functions/**"
      - "firestore.rules"
      - "storage.rules"
      - ".github/workflows/technician-checks.yml"
  pull_request:
    paths:
      - "kbi_technician_app/**"
      - "functions/**"
      - "firestore.rules"
      - "storage.rules"
      - ".github/workflows/technician-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kbi_technician_app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug

  ios-compile:
    runs-on: macos-15
    defaults:
      run:
        working-directory: kbi_technician_app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign

  functions-and-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: functions
      - run: npm run build
        working-directory: functions
      - run: npx --yes firebase-tools@15.20.0 emulators:exec --only firestore "node --test scripts/firestore-rules.test.mjs"
